name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      # Must match the personal key used by local Android Studio builds.
      RELEASE_CERT_SHA256: 6479192fc1646532afc357f27d1581832bef5e6ad15e2f44501d883f04c783ac
    outputs:
      apk_name: ${{ steps.version.outputs.apk_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sdk_name: ${{ steps.sdk.outputs.sdk_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and version
        id: version
        run: python3 tools/ci_release.py metadata

      - name: Extract this tag's categorized release notes
        run: python3 tools/release_notes.py "$RELEASE_TAG" --output-dir dist

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Test release checks and service lifecycle
        run: |
          python3 tools/test_release_notes.py
          python3 tools/test_ci_release.py
          python3 tools/test_update_version_manifest.py
          python3 tools/test_task_service_connection.py
          python3 tools/test_display_rotation.py
          python3 tools/test_rear_display_info.py
          python3 tools/test_rear_compatibility.py
          python3 tools/test_rear_geometry_discovery.py
          python3 tools/test_rear_cast_mode.py
          python3 tools/test_rear_density_preferences.py
          python3 tools/test_rear_presentation_preferences.py
          python3 tools/test_rear_cast_compatibility.py
          python3 tools/test_rear_cast_resize_policy.py
          python3 tools/test_rear_freeze_state.py
          python3 tools/test_rear_cast_viewport.py
          python3 tools/test_rear_cast_menu.py
          python3 tools/test_rear_touch_router.py
          python3 tools/test_rear_touch_state.py
          python3 tools/test_virtual_cast_request.py
          python3 tools/test_camera_gap_geometry.py
          python3 tools/test_camera_status.py
          python3 tools/test_rear_shell_catalog.py
          python3 tools/test_cast_notification.py
          python3 tools/test_cast_notification_touch.py
          python3 tools/test_package_android_sdk.py

      - name: Prepare Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.0.12077973'

      - name: Restore and validate signing key
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 tools/ci_release.py signing

      - name: Build release APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: >-
          ./android/gradlew -p android :app:assembleRelease :app:lintRelease --console=plain
          -PmrssVersionName="$RELEASE_VERSION" -PmrssVersionCode="$RELEASE_BUILD_NUMBER"

      - name: Verify APK and generate checksums
        run: python3 tools/ci_release.py verify build/app/outputs/apk/release/app-release.apk

      - name: Build RC2 SDK AAR
        run: ./android/gradlew -p android :platform-sdk:assembleRelease --console=plain

      - name: Stage SDK and sample sources for standalone build
        run: |
          mkdir -p sdk/sample/standalone/app/libs sdk/sample/standalone/app/src/main
          cp build/platform-sdk/outputs/aar/platform-sdk-release.aar \
            sdk/sample/standalone/app/libs/platform-sdk-0.4.0.aar
          cp -R sdk/sample/src/main/. sdk/sample/standalone/app/src/main/

      - name: Build standalone SDK sample APK
        run: ./android/gradlew -p sdk/sample/standalone :app:assembleDebug --console=plain

      - name: Package SDK, sample and integration guide
        id: sdk
        run: |
          sdk_version="$(awk -F= '$1 == "sdkVersion" { print $2 }' sdk/android/version.properties)"
          test -n "$sdk_version"
          sdk_name="remrss-platform-sdk-${sdk_version}.zip"
          sdk_bundle="$RUNNER_TEMP/${sdk_name%.zip}"
          python3 tools/package_android_sdk.py \
            --aar build/platform-sdk/outputs/aar/platform-sdk-release.aar \
            --sample-apk sdk/sample/standalone/app/build/outputs/apk/debug/app-debug.apk \
            --output "$sdk_bundle" --host-service 61 --host-release-compile-verified --host-apk-produced
          cp "$sdk_bundle.zip" "dist/$sdk_name"
          (cd dist && sha256sum "$sdk_name" >> SHA256SUMS)
          echo "sdk_name=$sdk_name" >> "$GITHUB_OUTPUT"

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/mrss-release.p12"

      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Publish APK and checksum file
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          SDK_NAME: ${{ needs.build.outputs.sdk_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" != 'true' ]]; then
              echo "Release already published; keeping its existing assets."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "$APK_NAME" "$SDK_NAME" SHA256SUMS LICENSE NOTICE --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" "$SDK_NAME" SHA256SUMS LICENSE NOTICE \
              --verify-tag --title "ReMRSS $RELEASE_TAG" \
              --notes-file release-notes.md --draft
          fi
          if [[ "$PRERELEASE" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi

  update-version:
    name: Update ReMRSS stable Raw version manifest
    needs: [build, release]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: remrss-stable-version-manifest
      cancel-in-progress: false
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified APK metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Update main/updates/remrss/version.json after publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/update_version_manifest.py
