name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      # Must match the personal key used by local Android Studio builds.
      RELEASE_CERT_SHA256: 6479192fc1646532afc357f27d1581832bef5e6ad15e2f44501d883f04c783ac
    outputs:
      apk_name: ${{ steps.version.outputs.apk_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and version
        id: version
        run: python3 tools/ci_release.py metadata

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Test release checks and service lifecycle
        run: |
          python3 tools/test_ci_release.py
          python3 tools/test_update_version_manifest.py
          python3 tools/test_task_service_connection.py
          python3 tools/test_rear_display_info.py
          python3 tools/test_rear_cast_mode.py
          python3 tools/test_rear_density_preferences.py
          python3 tools/test_rear_presentation_preferences.py
          python3 tools/test_rear_cast_compatibility.py
          python3 tools/test_rear_cast_viewport.py
          python3 tools/test_rear_cast_menu.py
          python3 tools/test_rear_touch_router.py
          python3 tools/test_rear_touch_state.py
          python3 tools/test_virtual_cast_request.py

      - name: Prepare Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.0.12077973'

      - name: Restore and validate signing key
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 tools/ci_release.py signing

      - name: Build release APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: >-
          ./android/gradlew -p android :app:assembleRelease --console=plain
          -PmrssVersionName="$RELEASE_VERSION" -PmrssVersionCode="$RELEASE_BUILD_NUMBER"

      - name: Verify APK and generate checksums
        run: python3 tools/ci_release.py verify build/app/outputs/apk/release/app-release.apk

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/mrss-release.p12"

      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Publish APK and checksum file
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          sha256sum --check SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ReMRSS 基于 AntiOblivionis 的 MRSS 项目继续开发；感谢上游测试贡献者汐木泽。

          - 新增可选虚拟背屏投放，与原直接方式共存，磁贴和 URI 自动化共用选择；支持主屏锁定后继续显示与操作。
          - 新增跟手侧滑返回和二段侧滑菜单，提供退出投放、左右旋转、全域与避开摄像头切换，并按 App 记住方向和范围。
          - 新增按 App 密度兼容设置，改善部分应用跨屏后局部缩放异常；所有应用默认关闭，不内置特定 App 名单。
          - 使用教程增加投放、截图、录屏三个磁贴的直接添加按钮；首页调整 Shizuku 优先级，独立页面统一返回箭头。
          - 修复背屏通知读取失败时套用固定尺寸和 DPI 的问题，失败保持可重试；清理正式调试标识，保留设备校验和交互保护。

          虚拟投放首次默认关闭，在“背屏 → 虚拟背屏投放”开启；需要 Android 13 及以上和受支持的背屏硬件，具体兼容边界见[虚拟投放说明](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/virtual-rear-casting.md)。

          沿用 ReMRSS 的包名 top.zainzh.rearscreen 和正式签名，可覆盖升级并保留现有数据；手机重启后仍需先启动 Shizuku，再打开 ReMRSS。

          - [对应版本源码](https://github.com/$GH_REPO/tree/$RELEASE_TAG)
          - [下载对应版本源码](https://github.com/$GH_REPO/archive/refs/tags/$RELEASE_TAG.zip)
          - [该版本构建说明](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/android-studio-release.md)
          - [GPL-3.0 完整许可证](https://github.com/$GH_REPO/blob/$RELEASE_TAG/LICENSE) · [贡献与修改说明](https://github.com/$GH_REPO/blob/$RELEASE_TAG/NOTICE)

          APK 内附带可离线阅读的 LICENSE 和 NOTICE，Release 另提供相同文件及 SHA256 校验。本版本允许依照 GPL-3.0 修改与再分发，不提供担保。
          EOF
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" != 'true' ]]; then
              echo "Release already published; keeping its existing assets."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "$APK_NAME" SHA256SUMS LICENSE NOTICE --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" SHA256SUMS LICENSE NOTICE \
              --verify-tag --title "ReMRSS $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
          if [[ "$PRERELEASE" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi

  update-version:
    name: Update ReMRSS stable Raw version manifest
    needs: [build, release]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: remrss-stable-version-manifest
      cancel-in-progress: false
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified APK metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Update main/updates/remrss/version.json after publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/update_version_manifest.py
